services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    container_name: n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=2
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_METRICS=${N8N_METRICS}
    ports:
      # In plain HTTP mode setup.sh sets N8N_PORT_BINDING=<port>:5678 (binds 0.0.0.0).
      # In HTTPS/Caddy mode it sets 127.0.0.1:5678:5678 — n8n stays on loopback,
      # Caddy is the only public entrypoint.
      - "${N8N_PORT_BINDING}"
    volumes:
      - n8n_storage:/home/node/.n8n
    mem_limit: ${N8N_MEM_LIMIT}
    mem_reservation: ${N8N_MEM_RESERVATION}
    memswap_limit: ${N8N_MEMSWAP_LIMIT}
    cpus: ${N8N_CPUS_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: n8n-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_storage:
  caddy_data:
  caddy_config:
